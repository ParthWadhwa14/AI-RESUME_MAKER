[project]
name = "resume-website-maker"
version = "0.1.0"
description = "Resume Gala - AI-Orchestrated Portfolio Website Generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "supabase>=2.0.0",
    "pyjwt>=2.8.0",
    "pypdf>=4.2.0",
    "crewai[tools]==1.14.5a2",
]

[project.scripts]
start-backend = "backend.app.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
