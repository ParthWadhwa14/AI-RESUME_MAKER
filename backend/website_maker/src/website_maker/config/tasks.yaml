# tasks.yaml - Advanced Portfolio Pipeline (With Asset & SEO Handling)

planning_task:
  description: >
    Analyze the user's '{resume_input}' and stylistic preferences from the '{user_prompt}'. 
    Create a comprehensive architectural blueprint for a client-side React portfolio. 
    You must decide the optimal sections (e.g., Bento Projects, Experience Timeline). 
    Additionally, you must generate the SEO strategy: define the website's Title, Meta Description, 
    and OpenGraph tags based on the user's profession. 
  expected_output: >
    A structured JSON blueprint detailing the page layout, routing hierarchy, specific section requirements, 
    and a nested "seo_metadata" object containing the title, description, and keywords.
    Guardrail: output must be valid JSON only (no markdown).
  agent: planning_agent

design_task:
  description: >
    Review the architectural blueprint and '{user_prompt}'. Generate a strict visual design system. 
    Define the exact Tailwind color palette, typography choices (Google Fonts), spacing scales, 
    and Framer Motion transition curves.
  expected_output: >
    A JSON manifest containing the complete design system tokens (Tailwind variables, typography, 
    and Framer Motion rules) to be consumed by the Coding Agent.
    Guardrail: output must be valid JSON only (no markdown).
  agent: design_theme_agent

research_task:
  description: >
    Scan the '{resume_input}' to identify if the user requires live metrics (e.g., GitHub stats). 
    If so, extract verifiable metadata and format it into a localized data structure. 
  expected_output: >
    A static JSON object containing structured external metadata ready to be imported into the React components.
    Guardrail: include `sources` list with URLs and keep unverifiable claims out.
  agent: research_agent

asset_collection_task:
  description: >
    Analyze the '{resume_input}' and the structural blueprint to resolve all visual assets required for the website.
    You must categorize assets into three strict groups:
    1. UI & Tech Icons: Do NOT download these. Map required tech stack icons (React, Docker, Python) and UI elements to the `lucide-react` or `react-icons` libraries.
    2. Company/Institution Logos: Find reliable image URLs for the specific companies and schools mentioned
       using active providers (logo.dev, official brand assets, Wikimedia, or public CDNs). Map these to a local
       download path (e.g., `/public/logos/google.png`).
    3. Portfolio Images: Identify where project screenshots, background banners, or a user profile picture are needed. If the user hasn't provided them, source high-quality, relevant placeholder image URLs (via Unsplash Source or similar). Map them to a local download path.
  expected_output: >
    A strict JSON "Asset Manifest" containing:
    {
      "npm_icons": ["FaReact", "FaPython", "LuMail"],
      "downloads": [
        {"url": "https://img.logo.dev/microsoft.com", "target_path": "/public/assets/microsoft.png"},
        {"url": "https://source.unsplash.com/random/800x600/?technology", "target_path": "/public/assets/project_1.jpg"}
      ]
    }
    Guardrail: output must be valid JSON only and all image URLs must be publicly reachable.
  agent: asset_agent

coding_task:
  description: >
    Synthesize the layout blueprint, design tokens, research data, and the Asset Manifest.
    Start from this mandatory React scaffold: '{react_template}'.
    You MUST modify and extend that scaffold instead of generating a random project from scratch.
    Keep the Vite + React architecture and file paths previewable in Sandpack.
    Assemble the complete frontend codebase.
    CRITICAL REQUIREMENTS:
    1. Write modular `.jsx` or `.tsx` React components styled with CSS/Tailwind and Framer Motion.
    2. Inject the SEO metadata into the `<head>` of the main document.
    3. Use the `npm_icons` specified by the Asset Agent for tech stacks.
    4. Reference the downloaded images via local paths (e.g., `<img src="/assets/microsoft.png" />`).
    5. Generate a complete `package.json` file that includes all required dependencies (`framer-motion`, `lucide-react`, `tailwind`, etc.).
    6. You are explicitly allowed to rewrite existing files entirely when needed to satisfy correctness; do not append partial fragments.
    7. Ensure final output includes and preserves at minimum: `package.json`, `index.html`, `vite.config.js`, `src/main.jsx`, `src/App.jsx`.
  expected_output: >
    A complete dictionary mapping filenames (including `package.json`, `index.html`, and all `src/` files) 
    to their complete code strings, ready to be mounted into Sandpack.
    Guardrail: return strict JSON file map only (no markdown fences).
  agent: coding_agent

checking_task:
  description: >
    Perform rigorous static analysis on the React codebase generated by the Coding Task. 
    Ensure every icon used is actually present in the `package.json`. Search for unclosed JSX tags, 
    missing imports, or Tailwind class collisions. Apply surgical corrections if errors are found.
  expected_output: >
    A validated, syntax-perfect React codebase accompanied by a brief clean bill of health log.
  agent: checking_agent

testing_task:
  description: >
    Simulate a Vite/Next.js client-side build process on the validated codebase. 
    Verify that mobile responsiveness breakpoints are logically sound and that no animation states 
    will cause infinite render loops.
  expected_output: >
    The final, production-ready React codebase, certified to compile and execute perfectly.
    Guardrail: return a JSON object with keys: `status`, `issues`, `final_files`.
  agent: testing_agent

feedback_task:
  description: >
    Act as the final controlling gate for the entire pipeline. Review outputs from planning, design,
    research, assets, coding, checking, and testing. Enforce these rules:
    1. Reject if output is not valid JSON file map.
    2. Reject if required files are missing (`package.json`, main entry files, and at least one src file).
    3. Reject if there are unresolved test/check issues.
    4. Approve only if production-ready.
    5. Treat runtime-config placeholders (e.g., EmailJS service/template/public keys) as NON-FATAL warnings
       when the code includes clear env-based configuration fallback.
    If rejected, provide precise remediation and corrected snippets. If approved, provide final canonical files.
  expected_output: >
    Strict JSON object:
    {
      "verdict": "approved" | "needs_changes",
      "feedback": ["..."],
      "final_files": { "path": "content" }
    }
    Guardrail: Output must be valid JSON only (no markdown).
  agent: feedback_agent

editing_task:
  description: >
    Process the user's conversational edit request: '{edit_prompt}'. Calculate and apply the precise 
    surgical modifications required to the target component's JSX or Tailwind classes without rewriting unrelated files.
  expected_output: >
    The updated, isolated React component code string reflecting the requested changes.
  agent: editing_agent
