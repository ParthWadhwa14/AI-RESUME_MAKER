[project]
name = "website_maker"
version = "0.1.0"
description = "website-maker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.5a2"
]

[project.scripts]
website_maker = "website_maker.main:run"
run_crew = "website_maker.main:run"
train = "website_maker.main:train"
replay = "website_maker.main:replay"
test = "website_maker.main:test"
run_with_trigger = "website_maker.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
